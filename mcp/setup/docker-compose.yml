services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-fink-mcp
    ports:
      - "3000:8080"
    env_file:
      - '../../.env'
    environment:
      # Bypass native responses loop
      - ENABLE_OAI_API_RESPONSES=False
      # Allow browser webview sandbox rendering
      - ALLOW_IFRAME_SAME_ORIGIN=True
      # Enable API Keys for testing
      - ENABLE_API_KEYS=True
      # Offline mode to prevent HF embedding downloads hanging on start
      - OFFLINE_MODE=True
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=False
      - RAG_RERANKING_MODEL_AUTO_UPDATE=False
      - WHISPER_MODEL_AUTO_UPDATE=False
      # Load Alpha Vantage key from .env file
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
    volumes:
      # Persistent named volume pointing to your original Open WebUI database
      - open-webui-data:/app/backend/data
      # Mount static chart utilities directly to the server asset path
      - ../../open_webui/chartUtils.js:/app/backend/open_webui/static/chartUtils.js
      # Mount the host static folder containing chart.js and dynamic dashboards
      - ../../open_webui/static:/app/backend/open_webui/static/fink
    restart: always

volumes:
  open-webui-data:
    external: true
    name: fink_open-webui-data
