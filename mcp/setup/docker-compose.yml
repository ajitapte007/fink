services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-fink-mcp
    ports:
      - "3000:8080"
    env_file:
      - '../../.env'
    environment:
      # Bypass native responses loop
      - ENABLE_OAI_API_RESPONSES=False
      # Allow browser webview sandbox rendering
      - ALLOW_IFRAME_SAME_ORIGIN=True
      # Enable API Keys for testing
      - ENABLE_API_KEYS=True
      # Offline mode to prevent HF embedding downloads hanging on start
      - OFFLINE_MODE=True
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=False
      - RAG_RERANKING_MODEL_AUTO_UPDATE=False
      - WHISPER_MODEL_AUTO_UPDATE=False
      # Load Alpha Vantage key from .env file
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
    volumes:
      # Persistent named volume pointing to your original Open WebUI database
      - open-webui-data:/app/backend/data
      # Mount static chart utilities directly to the server asset path
      - ../../open_webui/chartUtils.js:/app/backend/open_webui/static/chartUtils.js
      # Mount the host static folder containing chart.js and dynamic dashboards
      - ../../open_webui/static:/app/backend/open_webui/static/fink
    depends_on:
      fink-mcp-server:
        condition: service_healthy
    restart: always

  fink-mcp-server:
    build:
      context: ../..
      dockerfile: mcp/setup/Dockerfile.mcp
    container_name: fink-mcp-server
    ports:
      - "8001:8001"
    env_file:
      - '../../.env'
    environment:
      # Container-specific path override (env_file handles API keys)
      - ALPHAVANTAGE_CACHE_DB=/app/data/alphavantage_cache.db
    volumes:
      # Share the cache DB with Open WebUI
      - open-webui-data:/app/data
      # Mount MCP source for live development (optional, remove for prod)
      - ../../mcp:/app/mcp
      # Share static data dir with Open WebUI (data JSONs written here are served by Open WebUI)
      - ../../open_webui/static:/app/open_webui/static
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  open-webui-data:
    external: true
    name: fink_open-webui-data
